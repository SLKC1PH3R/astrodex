version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrodex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: astrodex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrodex -d astrodex"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://astrodex:${POSTGRES_PASSWORD}@postgres:5432/astrodex
      IMPORT_CATALOG_ON_START: "true"
      PACKS_PER_DAY: ${PACKS_PER_DAY:-0}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  postgres_data:
